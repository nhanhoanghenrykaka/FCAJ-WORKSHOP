name: shopsflow-fullstack
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopsflow}
      POSTGRES_USER: ${POSTGRES_USER:-shopsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopsflow}
    volumes:
    - shopsflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-shopsflow} -d ${POSTGRES_DB:-shopsflow}
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-shopsflow}
      DB_USERNAME: ${POSTGRES_USER:-shopsflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shopsflow}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REGISTRATION_OTP_EXPIRATION_MINUTES: ${REGISTRATION_OTP_EXPIRATION_MINUTES:-5}
      REGISTRATION_OTP_RESEND_COOLDOWN_SECONDS: ${REGISTRATION_OTP_RESEND_COOLDOWN_SECONDS:-60}
      REGISTRATION_OTP_MAX_ATTEMPTS: ${REGISTRATION_OTP_MAX_ATTEMPTS:-5}
      REGISTRATION_VERIFICATION_VALID_MINUTES: ${REGISTRATION_VERIFICATION_VALID_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL:-admin@shopsflow.com}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-Admin123!}
      APP_SEED_ADMIN_NAME: ${APP_SEED_ADMIN_NAME:-Local Admin}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      APP_SEED_DEMO_USER_EMAIL: ${APP_SEED_DEMO_USER_EMAIL:-customer@shopsflow.com}
      APP_SEED_DEMO_USER_PASSWORD: ${APP_SEED_DEMO_USER_PASSWORD:-Customer123!}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost/payment-result}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost/api/payment/vnpay/callback}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_USD_TO_VND_RATE: ${VNPAY_USD_TO_VND_RATE:-25000}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/app/uploads}
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
    - shopsflow_uploads:/app/uploads
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - 80:80
volumes:
  shopsflow_postgres: null
  shopsflow_uploads: null
