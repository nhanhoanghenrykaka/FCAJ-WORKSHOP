spring.application.name=shopsflow
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.seed-admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed-admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed-admin.name=${APP_SEED_ADMIN_NAME:Admin}
app.seed-demo.enabled=${APP_SEED_DEMO_DATA:false}
app.seed-demo.user-email=${APP_SEED_DEMO_USER_EMAIL:customer@shopsflow.com}
app.seed-demo.user-password=${APP_SEED_DEMO_USER_PASSWORD:Customer123!}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Shopsflow
info.app.description=Cloud-ready e-commerce application
info.app.version=@project.version@

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# VNPay Sandbox payment gateway. Credentials are optional at startup; checkout
# returns a business error until TMN code, hash secret, and return URL are configured.
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}

# Storefront prices are displayed/stored in USD, VNPay accepts VND. For this demo
# the conversion rate is fixed and configurable. Production should source/manage
# this rate according to the merchant's pricing policy.
vnpay.usd-to-vnd-rate=${VNPAY_USD_TO_VND_RATE:25000}

# Gmail SMTP used for customer registration OTP verification.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.registration.otp.from=${MAIL_FROM:}
app.registration.otp.expiration-minutes=${REGISTRATION_OTP_EXPIRATION_MINUTES:5}
app.registration.otp.resend-cooldown-seconds=${REGISTRATION_OTP_RESEND_COOLDOWN_SECONDS:60}
app.registration.otp.max-attempts=${REGISTRATION_OTP_MAX_ATTEMPTS:5}
app.registration.otp.verification-valid-minutes=${REGISTRATION_VERIFICATION_VALID_MINUTES:15}

# Google Identity Services. Use the same Web OAuth client ID in frontend and backend.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Persistent profile images stored by the backend.
app.upload-dir=${APP_UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
