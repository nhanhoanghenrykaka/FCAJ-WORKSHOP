name: shopsflow-backend
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopsflow
      POSTGRES_PASSWORD: shopsflow
      POSTGRES_DB: shopsflow
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U shopsflow -d shopsflow
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shopsflow
      DB_USERNAME: shopsflow
      DB_PASSWORD: shopsflow
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REGISTRATION_OTP_EXPIRATION_MINUTES: ${REGISTRATION_OTP_EXPIRATION_MINUTES:-5}
      REGISTRATION_OTP_RESEND_COOLDOWN_SECONDS: ${REGISTRATION_OTP_RESEND_COOLDOWN_SECONDS:-60}
      REGISTRATION_OTP_MAX_ATTEMPTS: ${REGISTRATION_OTP_MAX_ATTEMPTS:-5}
      REGISTRATION_VERIFICATION_VALID_MINUTES: ${REGISTRATION_VERIFICATION_VALID_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL:-admin@shopsflow.com}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-Admin123!}
      APP_SEED_ADMIN_NAME: ${APP_SEED_ADMIN_NAME:-Local Admin}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      APP_SEED_DEMO_USER_EMAIL: ${APP_SEED_DEMO_USER_EMAIL:-customer@shopsflow.com}
      APP_SEED_DEMO_USER_PASSWORD: ${APP_SEED_DEMO_USER_PASSWORD:-Customer123!}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:5173/payment-result}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:8080/api/payment/vnpay/callback}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/app/uploads}
    ports:
    - 8080:8080
    volumes:
    - shopsflow_uploads:/app/uploads
volumes:
  pgdata: null
  shopsflow_uploads: null
