name: shopsflow-aws
services:
  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REGISTRATION_OTP_EXPIRATION_MINUTES: ${REGISTRATION_OTP_EXPIRATION_MINUTES:-5}
      REGISTRATION_OTP_RESEND_COOLDOWN_SECONDS: ${REGISTRATION_OTP_RESEND_COOLDOWN_SECONDS:-60}
      REGISTRATION_OTP_MAX_ATTEMPTS: ${REGISTRATION_OTP_MAX_ATTEMPTS:-5}
      REGISTRATION_VERIFICATION_VALID_MINUTES: ${REGISTRATION_VERIFICATION_VALID_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL:-}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-}
      APP_SEED_ADMIN_NAME: ${APP_SEED_ADMIN_NAME:-Admin}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-false}
      APP_SEED_DEMO_USER_EMAIL: ${APP_SEED_DEMO_USER_EMAIL:-customer@shopsflow.com}
      APP_SEED_DEMO_USER_PASSWORD: ${APP_SEED_DEMO_USER_PASSWORD:-Customer123!}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_USD_TO_VND_RATE: ${VNPAY_USD_TO_VND_RATE:-25000}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/app/uploads}
    expose:
    - '8080'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
    - shopsflow_uploads:/app/uploads
  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - 80:80
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
volumes:
  shopsflow_uploads: null
